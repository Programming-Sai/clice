name: Build and Release Binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# NOTE on the ubuntu-22.04 pin: PyInstaller links against glibc on the build machine,
# glibc is forward-compatible only. ubuntu-latest = 24.04 (glibc 2.38) breaks 22.04.
# Pin to 22.04 (glibc 2.35) so binary runs everywhere >=22.04. GitHub will retire
# ubuntu-22.04 label ~Apr 2027 — revisit then.

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset_name: clice-linux-x86_64
          - os: ubuntu-22.04-arm
            asset_name: clice-linux-arm64
          - os: macos-14
            asset_name: clice-macos-x86_64
          - os: macos-latest
            asset_name: clice-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build + runtime dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      # ── BUILD ───────────────────────────────────────────────
      - name: Build onedir bundle
        run: pyinstaller clice.spec

      # ── SMOKE (no Docker, no termmax) ───────────────────────
      # These catch 80% of PyInstaller breakage before we ship anything.
      # termmax/dind failures are WARN not FAIL - app must still boot headless.
      - name: Smoke - binary boots
        run: |
          ./dist/clice --help
          ./dist/clice config
          ./dist/clice get resources.memory
          ./dist/clice doctor || true  # doctor may warn without Docker - just must not crash
          ./dist/clice list || true    # registry fetch may be rate-limited - must not crash

      - name: Smoke - textual mounts headless
        run: |
          python -c "from ui.main import CliceApp; print('import ok')"
          python tests/screenshot_headless.py || echo "WARN: screenshot harness failed but build is still valid"
          ls -lh screenshots/ || true

      # ── ARTIFACTS (not Release yet) ─────────────────────────
      - name: Package binary
        run: |
          cd dist
          tar czf ../${{ matrix.asset_name }}.tar.gz clice

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.tar.gz
          retention-days: 14

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.asset_name }}
          path: screenshots/*.png
          retention-days: 14
          if-no-files-found: warn

  # ── GATE: publish only if all 4 builds + smokes passed ─────
  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Show what we built
        run: ls -R artifacts/

      - name: Flatten for release
        run: |
          mkdir -p release
          find artifacts -name "*.tar.gz" -exec cp {} release/ \;
          # also bundle screenshots per-OS into one tar for the release
          mkdir -p screenshots-all
          find artifacts -path "*/screenshots-*" -name "*.png" -exec cp {} screenshots-all/ \; || true
          ls -lh screenshots-all/ || true
          tar czf release/screenshots-all.tar.gz -C screenshots-all . 2>/dev/null || echo "no screenshots to bundle"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
