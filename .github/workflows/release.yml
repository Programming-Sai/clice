name: Build and Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# NOTE on the ubuntu-22.04 pin above: PyInstaller dynamically links against
# whatever glibc is present on the build machine, and glibc is only
# forward-compatible (a binary built on newer glibc won't run on older
# systems, but the reverse works fine). ubuntu-latest currently means
# Ubuntu 24.04 (glibc 2.38+), which breaks anyone still on 22.04 or older -
# pinning to 22.04 (glibc 2.35) produces a binary that runs everywhere 22.04
# does *and* everywhere newer. GitHub has begun deprecating the ubuntu-22.04
# runner label itself (targeted full removal ~April 2027) - that only
# affects future CI runs on this label, not binaries already built and
# released, but this pin will need revisiting before then.

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # pinned, not ubuntu-latest - see note below
            asset_name: clice-linux-x86_64
          - os: ubuntu-22.04-arm # ARM64 Linux
            asset_name: clice-linux-arm64
          - os: macos-13 # Intel
            asset_name: clice-macos-x86_64
          - os: macos-latest # Apple Silicon
            asset_name: clice-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build + runtime dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build onedir bundle
        run: pyinstaller clice.spec

      - name: Package as tarball
        run: |
          cd dist
          tar czf ../${{ matrix.asset_name }}.tar.gz clice

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}.tar.gz
